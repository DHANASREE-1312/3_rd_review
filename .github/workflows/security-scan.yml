name: Security & Quality Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9 AM

jobs:
  codeql-analysis:
    name: CodeQL Analysis (SAST + Quality)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript', 'typescript' ]

    steps:
    - uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        queries: security-extended,security-and-quality
        # Only use config file if it exists
        config: |
          name: "Custom CodeQL Configuration"
          disable-default-queries: false
          queries:
            - uses: security-extended
            - uses: security-and-quality
          paths:
            - backend/src
            - frontend/src
          paths-ignore:
            - "**/node_modules"
            - "**/test"
            - "**/tests"
            - "**/__tests__"
            - "**/dist"
            - "**/build"

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"

  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install Dependencies
        run: |
          cd backend && npm ci
          cd ../frontend && npm ci
          
      - name: Run Linting
        run: |
          cd backend && npm run lint || echo "Linting issues found"
          cd ../frontend && npm run lint || echo "Linting issues found"
          
      - name: Run Tests
        run: |
          cd backend && npm test || echo "Tests failed"
          cd ../frontend && npm test || echo "Tests failed"

  zap-scan:
    name: OWASP ZAP Scan
    runs-on: ubuntu-latest
    needs: [codeql-analysis, lint-and-test]
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          cd backend
          npm ci

      - name: Start Server
        run: |
          cd backend
          nohup npm start > server.log 2>&1 &
          echo $! > server_pid.txt
          sleep 15

      - name: Run ZAP Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:5000'
          cmd_options: '-a -j -l WARN'
          allow_issue_writing: false
          fail-action: false

      - name: Stop Server
        if: always()
        run: |
          if [ -f "backend/server_pid.txt" ]; then
            kill $(cat backend/server_pid.txt) || true
            rm -f backend/server_pid.txt
          fi
          pkill -f "node.*start" || true

      - name: Upload ZAP Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-results
          path: |
            report_html.html
            report_json.json
            report_md.md