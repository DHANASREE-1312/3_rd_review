# SonarCloud Configuration for Daily Mess Feedback System

# Project identification
sonar.projectKey=mess-feedback-system
sonar.organization=your-org-name

# Project metadata
sonar.projectName=Daily Mess Feedback System
sonar.projectVersion=1.0

# Source code location
sonar.sources=backend/src,frontend/src
sonar.tests=backend/src/__tests__,frontend/src/__tests__

# Exclude files from analysis
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts

# Language-specific settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Code coverage
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/test-*.js

# Encoding
sonar.sourceEncoding=UTF-8

# Analysis parameters
sonar.qualitygate.wait=true
